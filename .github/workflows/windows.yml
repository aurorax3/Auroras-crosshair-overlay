name: Windows build and logic tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: microsoft/setup-msbuild@v2
      - name: Install controller dependencies
        run: python -m pip install -r CrosshairGUI/requirements.txt
      - name: Build x64 Release with the Windows SDK
        run: msbuild AuroraCrosshairDX.sln /m:2 /p:Configuration=Release /p:Platform=x64
      - name: Test configuration, controller and benchmark tools
        run: python -m unittest discover -s tests -v
      - name: Test portable renderer logic with MSVC
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do call "%%i\Common7\Tools\VsDevCmd.bat" -arch=amd64
          cl /nologo /std:c++17 /EHsc /I AuroraCrosshairDX/include tests/renderer_logic.cpp /Fe:renderer-tests.exe
          if errorlevel 1 exit /b 1
          renderer-tests.exe
